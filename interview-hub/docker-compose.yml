services:
  db:
    image: postgres:17-alpine
    container_name: interview-hub-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - interviewhub_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  mailpit:
    image: axllent/mailpit
    container_name: interview-hub-mailpit
    restart: unless-stopped

    environment:
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  interviewhub_db_data: